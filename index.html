<!DOCTYPE html>
<html lang="id">

    <!-- Menghubungkan file HTML dengan file CSS untuk desain tampilan -->
    <link rel="stylesheet" href="style.css">
    <title>Profil-Siswa</title>
</head>
<body>

<!-- Kartu Profil Utama -->
<div class="profil">
    <!-- Foto profil -->
    <img src="profil.jpg" alt="Foto profil">
    
    <!-- Nama dan deskripsi diri -->
    <h1>Muhammad Naufal Syamsudin</h1>
    <p>Saya adalah siswa Smk Telekomunikasi Darul Ulum yang sedang mengikuti Pelatihan TIK</p>
    
    <!-- Link menuju profil Instagram -->
    <a href="https://www.instagram.com/syam.d.udin/" target="_blank">Kunjungi Instagram saya</a>
    
    <br><br> <!-- Memberi sedikit jarak antar elemen -->
    
    <!-- Tombol interaktif -->

</div>
